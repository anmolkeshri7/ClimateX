
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="ClimateX helps you explore weather conditions and plan your day.">

    <title>ClimateX | Weather Intelligence</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header class="header">
        <a href="#" class="brand" aria-label="ClimateX Home">

            <img
                src="image/logo.png"
                alt="ClimateX Logo"
                class="logo"
            >

            <div class="brand-info">
                <h1>Climate<span>X</span></h1>
                <p>Weather Intelligence</p>
            </div>

        </a>
    </header>

    <main>

        <!-- Hero Section -->
        <section class="hero">

            <p class="eyebrow">YOUR WEATHER, REIMAGINED</p>

            <h2>
                Understand the
                <span>Atmosphere.</span>
            </h2>

            <p class="hero-description">
                Explore the weather around you.
                Get the insights you need to plan your day
                with confidence.
            </p>

            <!-- City Search -->
            <div class="search-box">

                <input
                    type="text"
                    id="cityInput"
                    name="city"
                    placeholder="Enter a city name..."
                    aria-label="Enter city name"
                    autocomplete="off"
                >

                <button
                    type="button"
                    id="searchBtn"
                    class="search-btn"
                >
                    Search
                    <span aria-hidden="true">→</span>
                </button>

            </div>

        </section>

    </main>

    <script src="scripts.js"></script>

</body>

</html>
